project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - mapper.qmd
    - PLAN.md
    - docs/*.md
    - data/README.md
    - notes/thelist-opendata-status.md
  resources:
    - site/mapper/core.js
    - site/mapper/app.js
    - site/mapper/mapper.css
    - docs/02-hobart/*.csv

website:
  title: "city.infra"
  description: "Open urban network tools and data for Hobart, Tasmania"
  repo-url: https://github.com/mdsumner/city.infra
  repo-actions: [source, issue]
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: mapper.qmd
        text: Segment mapper
      - text: Notes
        menu:
          - href: PLAN.md
            text: Plan
          - href: docs/01-ua-stack.md
            text: UrbanAnalyst stack
          - href: docs/02-hobart-pipeline.md
            text: Hobart access run
          - href: docs/cycle-mapper-review.md
            text: Mapper review
          - href: docs/gtfs-feed-plan.md
            text: GTFS feed plan
          - href: docs/wkpool-neighbourhoods.md
            text: "Draft: wkpool and neighbourhoods"
          - href: data/README.md
            text: Data provenance
          - href: notes/thelist-opendata-status.md
            text: theLIST mirror status
  page-footer:
    left: 'Network data: "LIST Transport Segments" from theLIST &copy; State of Tasmania (CC BY 3.0 AU).'
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    toc: true
